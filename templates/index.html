<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeoDraft</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-block">
          <p class="eyebrow">Graphics Utility Prototype</p>
          <h1>GeoDraft</h1>
          <p class="subtitle">一个本地优先的图片标注与几何测量工具。</p>
        </div>

        <section class="panel">
          <label class="field-label" for="project-name">项目名称</label>
          <input id="project-name" type="text" value="GeoDraft Prototype" />

          <label class="field-label" for="project-notes">项目备注</label>
          <textarea id="project-notes" placeholder="写一点说明，方便以后回看。"></textarea>

          <label class="field-label" for="image-loader">加载图片</label>
          <div class="file-picker">
            <input id="image-loader" class="file-input" type="file" accept="image/*" />
            <label for="image-loader" class="file-trigger">选择图片</label>
            <div class="file-meta">
              <strong id="file-name">未选择图片</strong>
              <span>支持 PNG、JPG、JPEG、WebP、BMP</span>
            </div>
          </div>

          <div class="tool-row">
            <span class="field-label">工具</span>
            <div class="tool-group">
              <button data-tool="rectangle" class="tool-button active" type="button">矩形</button>
              <button data-tool="line" class="tool-button" type="button">线段</button>
              <button data-tool="polygon" class="tool-button" type="button">多边形</button>
            </div>
            <p class="tool-help">
              矩形用来框选区域，线段用来测距离，多边形适合不规则区域，双击可完成闭合。
            </p>
          </div>

          <div class="actions">
            <button id="clear-button" class="ghost" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M4 7h16M9 7V5h6v2M10 11v6M14 11v6M7 7l1 12h8l1-12"
                  fill="none"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.8"
                ></path>
              </svg>
              <span>清空标注</span>
            </button>
            <button id="download-button" class="ghost" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M12 4v10M8 10l4 4 4-4M5 19h14"
                  fill="none"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.8"
                ></path>
              </svg>
              <span>导出 PNG</span>
            </button>
            <button id="save-button" class="primary" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M5 5h11l3 3v11H5V5zm3 0v5h8V6.5M9 19v-5h6v5"
                  fill="none"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.8"
                ></path>
              </svg>
              <span>保存到本地</span>
            </button>
          </div>

          <p id="status-line" class="status-line">加载图片后，就可以开始标注和测量。</p>
        </section>

        <section class="panel metrics">
          <div class="metric-card">
            <span class="metric-label">标注数量</span>
            <strong id="annotation-count">0</strong>
          </div>
          <div class="metric-card">
            <span class="metric-label">当前选中</span>
            <strong id="selection-size">无</strong>
          </div>
          <div class="metric-card">
            <span class="metric-label">图片尺寸</span>
            <strong id="image-size">无文件</strong>
          </div>
        </section>

        <section class="panel">
          <div class="panel-heading">
            <h2>历史记录</h2>
            <button id="refresh-history" class="refresh-button" type="button" title="刷新历史">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 4v6h6M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
              </svg>
            </button>
          </div>
          <ul id="history-list" class="history-list">
            <li class="empty-state">还没有保存过项目。</li>
          </ul>
        </section>

        <section class="panel">
          <div class="panel-heading">
            <h2>标注列表</h2>
            <span id="annotation-hint">最新创建的排前面</span>
          </div>
          <ul id="annotation-list" class="annotation-list">
            <li class="empty-state">暂无标注。</li>
          </ul>

          <div id="annotation-name-editor" class="annotation-name-editor hidden">
            <label class="field-label" for="annotation-name-input">标注名称</label>
            <div class="annotation-name-row">
              <input id="annotation-name-input" type="text" placeholder="给当前标注起个名字。" />
              <button id="save-annotation-name" type="button">保存</button>
            </div>
          </div>
        </section>
      </aside>

      <main class="workspace">
        <div class="workspace-header">
          <div>
            <p class="eyebrow">Canvas Workspace</p>
            <h2>图片标注</h2>
          </div>
          <p class="workspace-note">支持图片导入、几何标注、项目备注、历史恢复和标注图导出。</p>
        </div>

        <section class="canvas-panel">
          <canvas id="draft-canvas" aria-label="GeoDraft canvas"></canvas>
          <div id="canvas-overlay" class="canvas-overlay">
            <strong>画布已就绪</strong>
            <span>先加载一张本地图片，再开始标注。</span>
          </div>
        </section>
      </main>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
  </body>
</html>
